name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install project
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Validate repository workspace
        run: python scripts/validate_workspace.py
      - name: Smoke test installed CLI in a temporary workspace
        run: |
          set -eu
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          research-workspace init "$workspace" --language en
          research-workspace onboard "$workspace" --language en <<'EOF'
          2
          SmokeConcept
          y
          1
          3
          1
          y

          EOF
          research-workspace validate-profile "$workspace/.research/config/researcher-profile.yaml" --language en
          research-workspace profile show --path "$workspace/.research/config/researcher-profile.yaml" --language en
          research-workspace validate "$workspace" --language en
